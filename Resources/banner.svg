<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="50%" stop-color="#0D1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrange" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#FF5E62" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FF9966" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Background Card -->
  <rect x="10" y="10" width="1180" height="400" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="10" y="10" width="1180" height="400" rx="28" fill="url(#glowCyan)"/>
  <rect x="10" y="10" width="1180" height="400" rx="28" fill="url(#glowPurple)"/>
  <rect x="10" y="10" width="1180" height="400" rx="28" fill="url(#glowOrange)"/>
  <rect x="10" y="10" width="1180" height="400" rx="28" fill="url(#grid)"/>

  <!-- Top Pill Badge -->
  <g transform="translate(600, 58)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="-116" cy="0" r="4" fill="#00F2FE"/>
    <text x="6" y="4.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.8" text-anchor="middle">
      NATIVE MACOS MENU BAR PLAYER
    </text>
  </g>

  <!-- Center Branding: Icon & Title -->
  <g transform="translate(600, 155)">
    <!-- Brand Icon -->
    <g transform="translate(-190, -32)">
      <!-- Squircle Base -->
      <rect x="0" y="0" width="64" height="64" rx="16" fill="#11141D" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2"/>
      <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#glowCyan)" opacity="0.6"/>
      <!-- Waveform Bars inside Icon -->
      <rect x="15" y="24" width="4" height="16" rx="2" fill="#00F2FE"/>
      <rect x="23" y="16" width="4" height="32" rx="2" fill="#4FACFE"/>
      <rect x="31" y="12" width="4" height="40" rx="2" fill="#818CF8"/>
      <rect x="39" y="20" width="4" height="24" rx="2" fill="#A855F7"/>
      <rect x="47" y="26" width="4" height="12" rx="2" fill="#C084FC"/>
    </g>

    <!-- Typography -->
    <text x="-105" y="18" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" letter-spacing="8" text-anchor="start">
      MOOZIAC
    </text>
  </g>

  <!-- Tagline / Mission -->
  <text x="600" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="400" letter-spacing="0.2" text-anchor="middle">
    A fast, distraction-free YouTube Music &amp; local audio player tucked right into your Mac's menu bar.
  </text>
  <text x="600" y="262" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.1" text-anchor="middle">
    Native Swift 5.9 &amp; AppKit · 114 MB RAM · Hardware Edge Haptics · Real-Time Synced Lyrics · Zero Telemetry
  </text>

  <!-- Feature Capsule Pills at Bottom -->
  <g transform="translate(600, 335)">
    <!-- Pill 1 -->
    <g transform="translate(-420, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#121622" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        🏝️ Dynamic Island Pill
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-140, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#121622" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        🖐️ Multitouch Edge Haptics
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(140, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#121622" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        🔄 Dual Online &amp; Offline
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(420, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#121622" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        🛡️ 100% Local-First Privacy
      </text>
    </g>
  </g>
</svg>
